input {
  file {
    path => "/var/log/churn/api.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/api.sincedb"
    ecs_compatibility => "disabled"

    codec => multiline {
      pattern => "^\d{4}-\d{2}-\d{2} "
      negate => true
      what => "previous"
      auto_flush_interval => 2
    }
  }
}

filter {
  grok {
    match => {
      "message" => "(?m)^%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:level} %{NOTSPACE:logger_name} %{GREEDYDATA:details}"
    }
  }

  if [log_time] {
    date {
      match => ["log_time", "yyyy-MM-dd HH:mm:ss,SSS"]
      timezone => "UTC"
      target => "@timestamp"
    }
  }

  if [details] {
    kv {
      source => "details"
      include_keys => [
        "client_ip",
        "model_version",
        "prediction",
        "probability",
        "duration_ms"
      ]
    }
  }

  mutate {
    convert => {
      "probability" => "float"
      "duration_ms" => "float"
    }
  }

  mutate {
    rename => {
      "duration_ms" => "response_time"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "churn-api-%{+yyyy.MM.dd}"
    ilm_enabled => false
    data_stream => false
  }
}
