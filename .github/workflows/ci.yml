name: CI ML Churn

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_DOCS_URL: http://localhost:8001/docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest selenium

      - name: Démarrer l’API
        run: |
          mkdir -p logs
          python -m uvicorn api.main:app \
            --host 127.0.0.1 \
            --port 8001 > /tmp/churn-api.log 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8001/health; then
              echo
              echo "API disponible"
              exit 0
            fi
            sleep 2
          done

          echo "L’API n’a pas démarré"
          cat /tmp/churn-api.log
          exit 1

      - name: Tests
        run: python -m pytest -v --tb=short

      - name: Afficher les logs en cas d’échec
        if: failure()
        run: |
          cat /tmp/churn-api.log 2>/dev/null || true
          tail -n 100 chromedriver.log 2>/dev/null || trueclear